  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)" />
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" stroke="rgba(255,255,255,0.10)" stroke-width="3" />

  <path d="M330 380 L502 512 L330 644" stroke="url(#accent)" stroke-width="74" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M560 644 H700" stroke="url(#cursor)" stroke-width="74" stroke-linecap="round" />
</svg>
