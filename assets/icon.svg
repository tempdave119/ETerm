<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2c333d" />
      <stop offset="0.52" stop-color="#171b21" />
      <stop offset="1" stop-color="#0a0d11" />
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="150" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent" x1="320" y1="372" x2="712" y2="652" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b6d2ff" />
      <stop offset="0.55" stop-color="#7ea4ff" />
      <stop offset="1" stop-color="#5a79ee" />
    </linearGradient>
    <linearGradient id="cursor" x1="556" y1="640" x2="700" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8fb4ff" />
