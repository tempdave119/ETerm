name: release

# 打 tag 即出包：x64 / arm64 分别交给对应架构的 runner 构建，再统一发布到一个 Release。
# branches 里的 ci-probe 是诊断用临时入口，定位完 CI 环境差异后移除。
on:
  push:
    tags:
      - "v*"
    branches:
      - "ci-probe"

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: 安装依赖
        run: |
          set -o pipefail
          npm ci 2>&1 | tee /tmp/build.log

      - name: 单元测试
        run: |
          set -o pipefail
          npm test 2>&1 | tee -a /tmp/build.log

      - name: 构建主进程与渲染层
        run: |
          set -o pipefail
          npm run build 2>&1 | tee -a /tmp/build.log

      # --publish never 必须显式给：electron-builder 看到 git tag 会自动尝试发布，
      # 缺 GH_TOKEN 直接失败；发布统一交给下面的 publish job。
      - name: 打包 dmg
        run: |
          set -o pipefail
          npx electron-builder --mac dmg --${{ matrix.arch }} --publish never 2>&1 | tee -a /tmp/build.log

      # 失败时把关键错误写成 annotation（公开可读），完整日志进 job summary。
      - name: 失败诊断
        if: failure()
        run: |
          KEY=$(tail -60 /tmp/build.log 2>/dev/null | grep -iE "error|⨯|failed|not found|cannot" | head -4 | tr '\n' ' ' | cut -c1-700)
          echo "::error title=DIAG-${{ matrix.arch }}::${KEY:-没有匹配到错误行}"
          {
            echo "## 构建失败诊断（${{ matrix.arch }}）"
            echo ""
            echo "- node: $(node -v)"
            echo "- npm: $(npm -v)"
            echo "- arch: $(uname -m)"
            echo "- os: $(sw_vers -productVersion)"
            echo ""
            echo '```'
            tail -80 /tmp/build.log 2>/dev/null || echo "（没有 build.log）"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传构建产物
        uses: actions/upload-artifact@v5
        with:
          name: dmg-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.dmg.blockmap
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: 汇总构建产物
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: 创建 Release 并上传产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la artifacts
          gh release create "$GITHUB_REF_NAME" \
            --title "ETerm ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            artifacts/*.dmg artifacts/*.dmg.blockmap
