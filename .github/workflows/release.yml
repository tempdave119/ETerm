name: release

# 打 tag 即出包：x64 dmg 交给 Intel runner 构建，成功后自动创建 Release 并挂上产物。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos-x64:
    runs-on: macos-15-intel
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 单元测试
        run: npm test

      - name: 构建 dmg
        run: npm run dist

      - name: 创建 Release 并上传产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "ETerm ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            release/*.dmg release/*.dmg.blockmap
